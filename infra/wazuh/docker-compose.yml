# Wazuh manager only - no indexer, no dashboard.
#
# The full wazuh-docker stack ships its own OpenSearch indexer and dashboard, which would
# duplicate Elasticsearch and Kibana that this lab already runs. PROJECT_PLAN.md asks whether
# Wazuh is useful as a complementary host-log and FIM source, not whether a second SIEM can
# be installed alongside the first. The manager alone answers that question: it writes its
# alerts to /var/ossec/logs/alerts/alerts.json, which can be shipped into the existing
# Elasticsearch the same way Suricata EVE JSON is.
#
# Ports are bound to the host-only address, consistent with the rest of the lab.
services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: aegis-wazuh-manager
    restart: "no"
    environment:
      - INDEXER_URL=
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    ports:
      # 1514 agent events, 1515 agent enrolment, 55000 management API
      - "192.168.56.1:1514:1514"
      - "192.168.56.1:1515:1515"
      - "192.168.56.1:55000:55000"
    volumes:
      - wazuh-logs:/var/ossec/logs
      - wazuh-etc:/var/ossec/etc
    networks:
      - wazuh
    mem_limit: 4g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

volumes:
  wazuh-logs:
  wazuh-etc:

networks:
  wazuh:
