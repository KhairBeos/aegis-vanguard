# Template only. Elasticsearch now requires authentication, so replace the
# api_key placeholder on victim-win-01 with the value printed by
# scripts/new-agent-api-key.ps1. Never commit the real key.
outputs:
  default:
    type: elasticsearch
    hosts:
      - "http://192.168.56.1:9200"
    api_key: "REPLACE_WITH_AGENT_API_KEY"

management:
  mode: local

agent.monitoring:
  enabled: false

inputs:
  - type: winlog
    id: aegis-windows-event-logs
    use_output: default
    data_stream:
      namespace: aegis_lab
    streams:
      - id: aegis-windows-application
        name: Application
        data_stream:
          type: logs
          dataset: system.application
        ignore_older: 72h
      - id: aegis-windows-system
        name: System
        data_stream:
          type: logs
          dataset: system.system
        ignore_older: 72h
      - id: aegis-windows-security
        name: Security
        data_stream:
          type: logs
          dataset: system.security
        ignore_older: 72h
      - id: aegis-windows-sysmon
        name: Microsoft-Windows-Sysmon/Operational
        data_stream:
          type: logs
          dataset: windows.sysmon
        ignore_older: 72h
      - id: aegis-windows-powershell
        name: Microsoft-Windows-PowerShell/Operational
        data_stream:
          type: logs
          dataset: windows.powershell
        ignore_older: 72h
      - id: aegis-windows-defender
        name: Microsoft-Windows-Windows Defender/Operational
        data_stream:
          type: logs
          dataset: windows.defender
        ignore_older: 72h
